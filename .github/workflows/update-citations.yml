name: Update Scholar citations

on:
  schedule:
    - cron: "17 3 * * 1,3,5"  # Mon/Wed/Fri at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-citations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly pyyaml

      - name: Update citation counts
        run: python bin/update_scholar_citations.py

      - name: Commit and push updates
        run: |
          if [[ -n "$(git status --porcelain _publications)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _publications
            git commit -m "Update Scholar citation counts"
            git push
          else
            echo "No citation changes."
          fi
